    <script>
      if (window.location.pathname === "/") {
        const heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = "/images/hero-hands.webp";
        heroPreload.setAttribute(
          "imagesrcset",
          "/images/hero-hands-640.webp 640w, /images/hero-hands-960.webp 960w, /images/hero-hands.webp 1672w"
        );
        heroPreload.setAttribute("imagesizes", "(max-width: 1240px) 100vw, 1240px");
        heroPreload.setAttribute("fetchpriority", "high");
        document.head.appendChild(heroPreload);
      }

    <title>VedanAI | Software Development &amp; AI Solutions</title>
    <style>
      html, body {
        margin: 0;
        background-color: #06030f;
        color: #f8fbff;
        color-scheme: dark;
      }
      .preloader {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        background: #06030f;
        opacity: 1;
        visibility: visible;
        transition: opacity .22s cubic-bezier(.4, 0, .2, 1), visibility .22s;
      }
      .preloader::before {
        content: "";
        position: absolute;
        width: min(48vw, 380px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(88, 38, 168, .22), transparent 68%);
        pointer-events: none;
      }
      .preloader__orbit {
        position: relative;
        display: grid;
        place-items: center;
        width: min(48vw, 180px);
        aspect-ratio: 1;
      }
      .preloader__ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        transform: rotate(-90deg);
      }
      .preloader__track,
      .preloader__progress {
        fill: none;
        stroke-width: 1.4;
      }
      .preloader__track {
        stroke: rgba(110, 144, 194, .23);
      }
      .preloader__progress {
        stroke: #00eea6;
        stroke-linecap: round;
        stroke-dasharray: 155 832;
        stroke-dashoffset: 0;
        opacity: .8;
        transform-origin: center;
        animation: preloaderOrbit 2.7s linear infinite;
      }
      .preloader__logo {
        display: block;
        width: 140px;
        height: 48px;
        object-fit: cover;
      }
      .preloader--leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader--leaving .preloader__orbit {
        transform: scale(.96);
        transition: transform .22s cubic-bezier(.4, 0, .2, 1);
      }
      @keyframes preloaderOrbit {
        to { transform: rotate(360deg); }
      }
      @media (max-width: 480px) {
        .preloader__orbit { width: min(46vw, 158px); }
        .preloader::before { width: min(46vw, 300px); }
        .preloader__logo { width: 130px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader__progress { animation: none; opacity: .35; }
      }
    </style>
  </head>
  <body>
    <div id="boot-preloader" class="preloader" role="status" aria-live="polite" aria-label="Loading VedanAI">
      <div class="preloader__orbit" aria-hidden="true">
        <svg class="preloader__ring" viewBox="0 0 320 320">
          <circle class="preloader__track" cx="160" cy="160" r="157" />
          <circle class="preloader__progress" cx="160" cy="160" r="157" />
        </svg>
        <div class="preloader__brand">
          <img class="preloader__logo" src="/images/logo.webp" alt="" width="501" height="498" />
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
